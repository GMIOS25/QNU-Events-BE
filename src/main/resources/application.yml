spring:
  application:
    name: qnu-events
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:12MB}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:28800}
  qr:
    signing-secret: ${QR_SIGNING_SECRET:}
    epoch-seconds: ${QR_EPOCH_SECONDS:15}
    grace-period-seconds: ${QR_GRACE_PERIOD_SECONDS:3}
  seed:
    demo-password: ${DEMO_PASSWORD:Demo@12345}
    enabled: ${SEED_DEMO_DATA:false}
