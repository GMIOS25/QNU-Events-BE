name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: qnu_events_test
          POSTGRES_USER: qnu_events
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qnu_events -d qnu_events_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_URL: jdbc:postgresql://localhost:5432/qnu_events_test
      DB_USERNAME: qnu_events
      DB_PASSWORD: ci_only_password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test with PostgreSQL
        run: bash ./mvnw -B -ntp -Pintegration verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
